# Morion OS 工作区级 cargo 配置
#
# 引导器目标: x86_64-unknown-uefi
# 内核目标: x86_64-unknown-none (暂未启用)

# ============================================================
# UEFI 引导器构建配置
# ============================================================
[target.x86_64-unknown-uefi]
rustflags = [
    "-C", "link-arg=/ENTRY:efi_main",
    "-C", "link-arg=/SUBSYSTEM:EFI_APPLICATION",
    "-C", "link-arg=/NODEFAULTLIB",
    "-C", "no-redzone=y",
    "-C", "code-model=small",
]

# ============================================================
# 内核构建配置 (x86_64-unknown-none)
# ============================================================
[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tkernel_test/linker.ld",
    "-C", "link-arg=-nostdlib",
    "-C", "no-redzone=y",
    "-C", "code-model=small",
    "-C", "relocation-model=static",
]

# ============================================================
# 构建标准库 — 仅在需要时通过 Makefile 传递 -Z build-std
# 内核 (x86_64-unknown-none) 需要; UEFI 引导器有预编译 std
# ============================================================
