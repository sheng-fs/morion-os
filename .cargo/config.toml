# Morion OS 工作区级 cargo 配置
#
# 内核目标: x86_64-unknown-none (自定义 bare-metal)
# 引导器目标: x86_64-unknown-uefi

# ============================================================
# 微内核构建配置
# ============================================================
[target.x86_64-unknown-none]
# 链接脚本
rustflags = [
    "-C", "link-arg=-T../../linker.ld",
    "-C", "link-arg=-z", "max-page-size=0x1000",
    # 禁用 SSE 自动生成 (内核不依赖 SSE)
    "-C", "target-feature=-sse,-sse2,-mmx",
    # 禁止红区 (中断不安全)
    "-C", "no-redzone=y",
    # 小代码模型 (内核在 -2GB 区域)
    "-C", "code-model=kernel",
]

# ============================================================
# UEFI 引导器构建配置
# ============================================================
[target.x86_64-unknown-uefi]
rustflags = [
    "-C", "link-arg=/ENTRY:efi_main",
    "-C", "link-arg=/SUBSYSTEM:EFI_APPLICATION",
    "-C", "link-arg=/NODEFAULTLIB",
    "-C", "no-redzone=y",
    "-C", "code-model=small",
]

# ============================================================
# 构建标准库 (所有目标)
# ============================================================
[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
