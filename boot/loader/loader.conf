# Morion OS 引导器配置
# 
# 这是引导器的顶层声明式配置文件。
# 所有修改在下一次引导时原子生效，无需重启引导服务。
#
# 配置优先级:
#   1. 编译期默认值 (硬编码在引导器二进制)
#   2. loader.conf (此文件, 在 ESP 分区)
#   3. 引导条目文件 (entries/*.conf)
#   4. 运行时用户选择 (菜单交互)

[meta]
name = "Morion OS Boot Manager"
version = "0.1.0"
bootloader = "morion-boot"

[defaults]
# 默认启动的操作系统标题
default = "Morion OS"
# 自动启动超时 (秒), 0 = 禁用自动启动
timeout = 5
# 超时后启动上次选择的操作系统 (而非默认)
boot_last_on_timeout = true

[display]
# 引导菜单分辨率 (auto = 使用 GOP 最大可用分辨率)
resolution = "auto"
# 强制使用高分辨率 (禁用文本模式回退)
force_high_res = true
# 控制台模式 (用于调试)
console_mode = "auto"

[security]
# 强制验证所有引导条目的签名
enforce_signatures = false
# 要求 TPM PCR 符合策略
require_tpm = false
# 允许启动未签名的条目 (开发模式)
allow_unsigned = true
# 审计日志路径
audit_log = "/var/log/morion-boot/audit.log"

[theme]
# 主题配置路径 (相对于 ESP 根)
path = "/EFI/morion/loader/theme.toml"
# 备用主题 (如果主主题不可用)
fallback = "builtin:default"

[nix]
# Nix store 路径前缀
store_prefix = "/nix/store"
# 自动扫描 store 发现引导条目
auto_discover = true
# 最大保留的世代数 (0 = 不限)
max_generations = 10
# 垃圾回收保护: 禁止删除当前和上次引导的世代
protected_generations = ["current", "last_booted"]

[kexec]
# 启用 kexec 热启动 (跳过固件重初始化)
enable = false
# kexec 模式
#   "warm" = 保留 UEFI 运行时服务
#   "cold" = 完全重置 (传统重启)
mode = "warm"

[chainload]
# 自动检测并列出其他操作系统 (通过扫描 EFI 分区)
os_prober = true
# 其他 EFI 应用路径 (手动指定)
# manual_entries = ["\\EFI\\Microsoft\\Boot\\bootmgfw.efi"]

[recovery]
# 救援模式: 始终在菜单中显示
always_show = true
# 救援模式的特殊内核参数
kernel_cmdline = "rescue single nomodeset"
