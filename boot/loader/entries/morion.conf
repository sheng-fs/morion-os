# Morion OS 引导条目 — 声明式配置文件
# 
# 此文件由 Nix 构建系统自动生成，不应手动编辑。
# 每个操作系统安装/版本快照都是一个完整的启动闭包。
#
# 格式：Nix-style INI/Toml 混合
# 所有路径指向 /nix/store/<hash>-system-boot/ 下的不可变文件

[entry]
title = "Morion OS"
version = "0.1.0-alpha"
hash = "00000000000000000000-dev"
path = "/nix/store/00000000000000000000-dev-system-boot"
generation = 1
type = "current"

[entry.kernel]
# 内核映像 (ELF64 或 bzImage 格式)
path = "/nix/store/00000000000000000000-dev-system-boot/kernel.elf"
# 内核命令行参数
cmdline = "quiet loglevel=3 init=/sbin/init morion.root=/dev/nvme0n1p2"

[entry.initrd]
# 初始 RAM 磁盘 (包含微内核用户态服务)
path = "/nix/store/00000000000000000000-dev-system-boot/initrd.img"

[entry.security]
# Ed25519 签名文件 (内核 + initrd 的组合签名)
signature = "/nix/store/00000000000000000000-dev-system-boot/system.sig"
# TPM PCR 策略 (要求指定 PCR 值为可信状态)
# pcr_policy = "sha256:4=abc...,8=def...,9=ghi..."

[entry.enclave]
# 飞地设备直通白名单 (PCI 地址)
# passthrough_devices = ["0000:01:00.0", "0000:02:00.0"]

[entry.bootloader]
# 引导器版本兼容性要求
min_bootloader_version = "0.1.0"
