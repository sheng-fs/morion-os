[package]
name = "morion-boot"
version = "0.1.0"
edition = "2021"
description = "Morion OS 声明式微引导加载器 — 基于 UEFI + Rust 的最小可信链引导系统"
authors = ["Morion OS Team"]
license = "MIT"

[lib]
name = "morion_boot"
crate-type = ["lib"]

[[bin]]
name = "morion-boot"
path = "src/main.rs"

[dependencies]
# UEFI 基础运行时 (不使用 std), 启用 alloc 支持
uefi = { version = "0.26", features = ["alloc"] }

# SM3 国密哈希 (RustCrypto, no_std 纯 Rust) — 映像完整性摘要
sm3 = { version = "0.4", default-features = false }

# SM2 国密签名验证 (RustCrypto, no_std 纯 Rust) — Secure Boot 验签
sm2 = { version = "0.13", default-features = false, features = ["alloc", "dsa"] }

# 无浮点的 2D 图形运算
# 使用整数运算实现亚克力毛玻璃效果

[features]
default = []
# 启用 Secure Boot 签名验证
secure-boot = []
# 启用 TPM 2.0 测量
tpm-measure = []
# 启用 kexec 热启动
kexec = []
# 启用动画效果
animation = ["default"]
