[package]
name = "morion-files"
version = "0.1.0"
edition = "2021"
authors = ["Morion OS Team"]
license = "MIT"
description = "MorionOS 双栏文件列表骨架 (窗口 + 列表控件 + VFS)"

[[bin]]
name = "morion-files"
path = "src/main.rs"

[dependencies]
morion = { path = "../../libmorion" }

# 独立工作区: 本目录在根工作区内, 但暂不加入根 workspace 的 members
# (第二批接线时由构建系统统一决定)。
[workspace]
