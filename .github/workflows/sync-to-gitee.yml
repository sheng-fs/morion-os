# ============================================================
# 配置说明：在 GitHub 仓库添加 Gitee 令牌
# ------------------------------------------------------------
# 1. 登录 Gitee → 设置 → 私人令牌 → 生成新令牌（勾选 projects 权限）
# 2. GitHub 仓库 → Settings → Secrets and variables → Actions
# 3. 点击 "New repository secret"
# 4. Name 填: GITEE_TOKEN
# 5. Secret 填: 第1步生成的 Gitee 令牌
# ============================================================

name: Sync to Gitee

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，确保镜像完整

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee "https://sheng_jheng:${GITEE_TOKEN}@gitee.com/sheng_jheng/morion-os.git"
          git push --force gitee main:main
