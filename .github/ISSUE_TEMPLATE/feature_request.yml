name: ✨ 功能请求
description: 提出新功能或改进建议
title: "[Feat] "
labels: ["feat"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 所属模块
      description: 该功能归属哪个模块？
      options:
        - boot (引导加载器)
        - kernel (微内核)
        - ui-assets (UI 素材/资源)
        - security (安全)
        - ci (构建/CI)
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 背景与动机
      description: 这个功能解决什么问题？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 方案描述
      description: 你期望的功能或实现思路
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他实现方式？
